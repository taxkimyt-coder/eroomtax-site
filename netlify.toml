[build]
  publish = "."
  functions = "netlify/functions"
  # 사이트 자체는 빌드 없음(정적 HTML) — 이 명령은 함수가 쓰는 @netlify/blobs 패키지만 설치한다.
  command = "npm install --prefix netlify/functions"

[functions]
  node_bundler = "esbuild"

# 매일 오전 9시 / 오후 4시 / 오후 10시(KST) = UTC 00:00 / 07:00 / 13:00 — Netlify 스케줄 함수는 UTC 기준으로 동작
[functions."blog-sync"]
  schedule = "0 0,7,13 * * *"
